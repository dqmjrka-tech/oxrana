<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Пульт дистанционного управления</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f1117; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
    .card { background: #1a1d26; border-radius: 14px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 19px; margin-bottom: 18px; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; }
    
    .status-box { padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; font-size: 16px; }
    .status-disarmed { background: #374151; color: #9ca3af; }
    .status-armed { background: #166534; color: #4ade80; }
    .status-alarm { background: #991b1b; color: #fca5a5; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .btn { display: block; width: 100%; padding: 16px; margin: 12px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; color: #fff; }
    .btn-arm { background: #16a34a; }
    .btn-arm:hover { background: #15803d; }
    .btn-disarm { background: #dc2626; }
    .btn-disarm:hover { background: #b91c1c; }
    .btn-snap { background: #2563eb; }
    .btn-snap:hover { background: #1d4ed8; }

    #snapPreview { width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid #374151; display: none; }
    .timestamp { font-size: 13px; color: #9ca3af; margin-top: 6px; }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="card">
    <h1>Пульт управления</h1>
    <div id="statusBox" class="status-box status-disarmed">СНЯТО С ОХРАНЫ</div>

    <button class="btn btn-arm" onclick="setMode('armed')">На охрану</button>
    <button class="btn btn-disarm" onclick="setMode('disarmed')">Снять с охраны</button>
    <button class="btn btn-snap" onclick="requestScreenshot()">Сделать скриншот</button>

    <img id="snapPreview" alt="Скриншот с камеры">
    <div id="snapTime" class="timestamp"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDRH07hc8tMsG1TvMyHOptrOTEJDp_4kE8",
      authDomain: "clutch-shuter.firebaseapp.com",
      databaseURL: "https://clutch-shuter-default-rtdb.firebaseio.com",
      projectId: "clutch-shuter",
      storageBucket: "clutch-shuter.firebasestorage.app",
      messagingSenderId: "224141175517",
      appId: "1:224141175517:web:2ed8bd5da35adc15dc4934",
      measurementId: "G-DLJ39T1N88"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function setMode(state) {
      db.ref("alarm_system/status").set({ state: state, updatedAt: Date.now() });
    }

    function requestScreenshot() {
      db.ref("alarm_system/requestSnapshot").set(Date.now());
    }

    // Слушатель статуса
    db.ref("alarm_system/status").on("value", (snap) => {
      const data = snap.val();
      const box = document.getElementById("statusBox");
      if (!data) return;

      if (data.state === "alarm") {
        box.className = "status-box status-alarm";
        box.innerText = "🚨 ТРЕВОГА!";
      } else if (data.state === "armed") {
        box.className = "status-box status-armed";
        box.innerText = "● ПОД ОХРАНОЙ";
      } else {
        box.className = "status-box status-disarmed";
        box.innerText = "СНЯТО С ОХРАНЫ";
      }
    });

    // Слушатель получения снимка
    db.ref("alarm_system/snapshot").on("value", (snap) => {
      const data = snap.val();
      if (!data || !data.image) return;

      const img = document.getElementById("snapPreview");
      const timeBox = document.getElementById("snapTime");
      img.src = data.image;
      img.style.display = "block";
      timeBox.innerText = `Снимок сделан: ${data.timeText || new Date(data.timestamp).toLocaleString("ru-RU")}`;
    });
  </script>
</body>
</html>
